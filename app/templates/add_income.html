{% extends "base.html" %}

{% block title %}
Add Income | FinAI Pro
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold mb-1">
                <i class="bi bi-plus-circle text-success me-2"></i>
                Add Income
            </h2>

            <p class="text-muted mb-0">
                Record a new source of income.
            </p>
        </div>

        <a href="/income"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-1"></i>
            Back to Income

        </a>

    </div>


    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-lg-5">

                    <div class="text-center mb-4">

                        <div class="rounded-circle bg-success-subtle
                                    d-inline-flex p-3 mb-3">

                            <i class="bi bi-wallet2 text-success fs-2"></i>

                        </div>

                        <h4 class="fw-bold">
                            Add New Income
                        </h4>

                        <p class="text-muted">
                            Enter the details of your income below.
                        </p>

                    </div>


                    <form method="POST"
                          action="/income/add">


                        <!-- Source -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Income Source
                            </label>

                            <input
                                type="text"
                                name="source"
                                class="form-control form-control-lg"
                                placeholder="e.g. Salary, Freelancing, Business"
                                required>

                        </div>


                        <!-- Category -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Category
                            </label>

                            <select
                                name="category"
                                class="form-select form-select-lg"
                                required>

                                <option value="">
                                    Select category
                                </option>

                                <option value="Salary">
                                    Salary
                                </option>

                                <option value="Freelancing">
                                    Freelancing
                                </option>

                                <option value="Business">
                                    Business
                                </option>

                                <option value="Investment">
                                    Investment
                                </option>

                                <option value="Gift">
                                    Gift
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- Amount -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Amount
                            </label>

                            <div class="input-group input-group-lg">

                                <span class="input-group-text">
                                    ₹
                                </span>

                                <input
                                    type="number"
                                    name="amount"
                                    class="form-control"
                                    placeholder="0.00"
                                    min="0.01"
                                    step="0.01"
                                    required>

                            </div>

                        </div>


                        <!-- Date -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Income Date
                            </label>

                            <input
                                type="date"
                                name="income_date"
                                class="form-control form-control-lg"
                                required>

                        </div>


                        <!-- Description -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="4"
                                placeholder="Add any additional details (optional)"></textarea>

                        </div>


                        <!-- Buttons -->
                        <div class="d-flex gap-2">

                            <a href="/income"
                               class="btn btn-outline-secondary btn-lg w-50">

                                Cancel

                            </a>

                            <button
                                type="submit"
                                class="btn btn-success btn-lg w-50">

                                <i class="bi bi-check-circle me-1"></i>
                                Save Income

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const dateInput =
        document.querySelector('input[name="income_date"]');

    if (dateInput) {

        const today =
            new Date().toISOString().split("T")[0];

        dateInput.value = today;

    }

});

</script>

{% endblock %}
